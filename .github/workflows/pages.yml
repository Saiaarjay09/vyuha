name: Publish site

# Why this exists: a hosted instance on a personal machine is unreachable
# whenever that machine sleeps. GitHub Pages is free, always on, needs no card
# and never sleeps -- it just cannot run Python. So the scheduled job rebuilds
# a static site carrying the data and the mathematics, and publishes that.
on:
  schedule:
    - cron: "20 4 * * 1-5"      # weekdays 04:20 UTC / 09:50 IST, after the daily learn job
  workflow_dispatch:
  push:
    branches: [main]
    # Deliberately NOT path-filtered. A narrow filter meant an ordinary commit
    # could not trigger a rebuild, so there was no way to publish after
    # enabling Pages short of editing one of the listed files. The build takes
    # about two minutes and the site should track main anyway.

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let the running one land first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build the static site
        # A failed data source must not block publishing: the build catches
        # per-section failures and writes an error marker, so the calculators
        # stay up even when a feed is down.
        run: python scripts/build_site.py --out site
      - name: Show what was built
        run: |
          ls -la site site/data
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
