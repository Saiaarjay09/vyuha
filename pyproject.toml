[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyuha"
version = "0.1.0"
description = "An open risk engine for Indian financial markets, with a bias-diverse LLM council."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vyuha contributors" }]
keywords = ["risk", "quant", "india", "nse", "portfolio", "llm", "ensemble"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "statsmodels>=0.14", "duckdb>=0.10", "pyarrow>=14", "httpx>=0.27",
  "pydantic>=2.6", "pydantic-settings>=2.2", "typer>=0.12", "rich>=13.0",
  "python-dateutil>=2.8", "lxml>=5.0", "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
vyuha = "vyuha.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." as well as "src": tests/test_site.py imports scripts.build_site, and the
# repo root is only implicitly on sys.path in some pytest invocations. It was
# present locally and absent in CI, so the suite passed here and failed there
# with ModuleNotFoundError.
pythonpath = [".", "src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # Typer's whole API is function calls in argument defaults
  "UP042",  # `str, Enum` is intentional: StrEnum changes how pydantic
            # serialises these and buys nothing here
]
